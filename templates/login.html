
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CloudHire</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .auth-container {
            max-width: 440px;
            margin: 65px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px #00000010;
        }

        .auth-container h1 {
            text-align: center;
            color: #1e40af;
            margin-bottom: 12px;
        }

        .auth-container p {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .auth-container label {
            display: block;
            margin: 17px 0 7px;
            font-weight: bold;
        }

        .auth-container input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
        }

        .auth-container input:focus {
            border-color: #2563eb;
        }

        .auth-container button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .auth-container button:hover {
            background: #1d4ed8;
        }

        .auth-container a {
            color: #2563eb;
            text-decoration: none;
        }

        .auth-container .switch {
            margin-top: 22px;
        }

        .message {
            background: #eaf1ff;
            color: #1e40af;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">Cloud<span>Hire</span></div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/#jobs">Find Jobs</a>
        </div>

    </nav>

    <!-- Login Form -->
    <div class="auth-container">

        <h1>Welcome Back!</h1>

        <p>Login to your CloudHire account.</p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create Account</a>
        </p>

        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </div>

</body>
</html>
