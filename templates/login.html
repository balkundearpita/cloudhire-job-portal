```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CloudHire</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .auth-container {
            max-width: 460px;
            margin: 65px auto;
            padding: 42px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.07);
            border: 1px solid #e5eaf3;
        }

        .auth-container h1 {
            text-align: center;
            color: #172554;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .auth-container p {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .auth-container label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 600;
            color: #334155;
        }

        .auth-container input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        .auth-container input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .auth-container button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        .auth-container button:hover {
            background: #1d4ed8;
        }

        .auth-container a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-container a:hover {
            text-decoration: underline;
        }

        .auth-container .switch {
            margin-top: 25px;
            margin-bottom: 12px;
        }

        .message {
            background: #eff6ff;
            color: #1e40af;
            padding: 13px;
            border-radius: 9px;
            margin-bottom: 15px;
            text-align: center;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
        }

        @media (max-width: 600px) {
            .auth-container {
                margin: 35px 16px;
                padding: 28px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">Cloud<span>Hire</span></div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/#jobs">Find Jobs</a>
        </div>
    </nav>

    <div class="auth-container">

        <h1>Welcome Back!</h1>

        <p>Login to your CloudHire account.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p class="switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create Account</a>
        </p>

        <a href="/" class="back-home">← Back to Home</a>

    </div>

</body>
</html>
```
