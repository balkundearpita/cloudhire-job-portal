```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CloudHire</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .auth-container {
            max-width: 460px;
            margin: 45px auto;
            padding: 40px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.07);
            border: 1px solid #e5eaf3;
        }

        .auth-container h1 {
            text-align: center;
            color: #172554;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .auth-container p {
            text-align: center;
            color: #64748b;
            margin-bottom: 22px;
        }

        .auth-container label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
            color: #334155;
        }

        .auth-container input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        .auth-container input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .auth-container button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        .auth-container button:hover {
            background: #1d4ed8;
        }

        .auth-container a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-container a:hover {
            text-decoration: underline;
        }

        .message {
            background: #eff6ff;
            color: #1e40af;
            padding: 13px;
            border-radius: 9px;
            margin-bottom: 15px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .auth-container {
                margin: 30px 16px;
                padding: 28px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">Cloud<span>Hire</span></div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </div>
    </nav>

    <div class="auth-container">

        <h1>Create Account</h1>

        <p>Join CloudHire and find your dream job.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">

            <label for="name">Full Name</label>
            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Enter your name"
                   autocomplete="name"
                   required>

            <label for="email">Email Address</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email"
                   autocomplete="email"
                   required>

            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Create password"
                   autocomplete="new-password"
                   minlength="6"
                   required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password"
                   id="confirm_password"
                   name="confirm_password"
                   placeholder="Confirm password"
                   autocomplete="new-password"
                   minlength="6"
                   required>

            <button type="submit">Create Account</button>

        </form>

        <p style="margin-top: 25px;">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </div>

</body>
</html>
