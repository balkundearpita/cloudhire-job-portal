
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CloudHire</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-container {
            max-width: 440px;
            margin: 55px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px #00000010;
        }
        .auth-container h1 {
            text-align: center;
            color: #1e40af;
            margin-bottom: 12px;
        }
        .auth-container p {
            text-align: center;
            color: #64748b;
            margin-bottom: 20px;
        }
        .auth-container label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }
        .auth-container input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        .auth-container button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        .auth-container a {
            color: #2563eb;
            text-decoration: none;
        }
        .message {
            background: #eaf1ff;
            color: #1e40af;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">Cloud<span>Hire</span></div>
        <div class="nav-links"><a href="/">Home</a></div>
    </nav>

    <div class="auth-container">

        <h1>Create Account</h1>
        <p>Join CloudHire and find your dream job.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/register">

            <label>Full Name</label>
            <input type="text" name="name"
                   placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Create password" required minlength="6">

            <label>Confirm Password</label>
            <input type="password" name="confirm_password"
                   placeholder="Confirm password" required minlength="6">

            <button type="submit">Create Account</button>

        </form>

        <p>
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</body>
</html>
